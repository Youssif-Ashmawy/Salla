<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salla">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Salla — Groceries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --surface:#fffdf9; --ink:#1b1a17; --muted:#77716a; --faint:#a9a299; --line:#e8e2d8;
  --accent:#3f5e45; --accent-ink:#fff; --accent-soft:#e3ebe0; --danger:#b4492d; --danger-soft:#f7e3dc;
  --shadow:0 1px 0 rgba(27,26,23,.04),0 8px 24px -12px rgba(27,26,23,.18);
  --t-fruits:#fbe4dc; --t-veggies:#e4eedb; --t-pasta:#f6ecc9; --t-spices:#f3dfcc; --t-bakery:#f4e8d3; --t-dairy:#e1eaf4; --t-cheese:#fbefc4; --t-meat:#f5e0db; --t-pantry:#eee6d8; --t-frozen:#ddeff2;
  --t-snacks:#fbe9d2; --t-drinks:#e9e3f4; --t-household:#e5e9e4; --t-personal:#f5e3ec; --t-other:#ebe8e3;
  --r:22px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#141413; --surface:#1d1c1a; --ink:#f3f0ea; --muted:#a39d94; --faint:#6d685f; --line:#2c2a27;
    --accent:#9cc39f; --accent-ink:#13201a; --accent-soft:#22302a; --danger:#ef8f72; --danger-soft:#3a231c; --shadow:none;
    --t-fruits:#38231f; --t-veggies:#26301f; --t-pasta:#332d17; --t-spices:#38261a; --t-bakery:#33291b; --t-dairy:#1f2833; --t-cheese:#36301a; --t-meat:#35221f; --t-pantry:#2e281f; --t-frozen:#1c2e31;
    --t-snacks:#352a1a; --t-drinks:#28233a; --t-household:#242a25; --t-personal:#33222b; --t-other:#2a2825; }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.4;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(110px + env(safe-area-inset-bottom)) env(safe-area-inset-left);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea{font-family:inherit;color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
header{display:flex;align-items:flex-end;justify-content:space-between;padding:22px 0 14px;gap:12px}
.brand{font-family:'Instrument Serif',Georgia,serif;font-size:44px;line-height:.9;letter-spacing:-.01em}
.brand i{color:var(--accent);font-style:italic}
.sub{color:var(--muted);font-size:13.5px;margin-top:6px}
.hbtns{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:7px 11px;border-radius:999px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)} .dot.on{background:#4f9a62} .dot.off{background:var(--danger)} .dot.busy{background:#d9a441;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{width:40px;height:40px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
/* add bar */
.addbar{position:sticky;top:0;z-index:5;padding:10px 0 12px;background:linear-gradient(var(--bg) 78%,transparent)}
.addbar form{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 6px 6px 16px;box-shadow:var(--shadow);align-items:center}
.addbar input{flex:1;border:none;background:none;font-size:17px;padding:10px 0;outline:none;min-width:0}
.addbar input::placeholder{color:var(--faint)}
.addbtn{background:var(--accent);color:var(--accent-ink);width:46px;height:46px;border-radius:15px;font-size:24px;font-weight:500;display:grid;place-items:center;flex:none}
.suggest{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.suggest:empty{display:none}
.sg{display:flex;align-items:center;gap:12px;padding:9px 12px;width:100%;text-align:left;border-top:1px solid var(--line)}
.sg:first-child{border-top:none}
.sg .tile{width:38px;height:38px;border-radius:12px;font-size:20px}
.sg b{font-weight:600} .sg span.m{color:var(--muted);font-size:12.5px;margin-left:auto}
/* sections */
.sec{margin:18px 0 6px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:28px;letter-spacing:-.01em}
.sec .c{color:var(--muted);font-size:13px}
.cat{display:flex;align-items:center;gap:8px;margin:18px 2px 10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cat .sw{width:10px;height:10px;border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (max-width:520px){
  .grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .card{border-radius:18px}
  .card .tile{border-radius:13px;margin:5px;font-size:40px}
  .card .meta{padding:0 9px 9px;flex-direction:column;align-items:flex-start;gap:4px;min-height:0}
  .card .nm{font-size:13.5px}
  .card .qty{font-size:11px;padding:2px 7px}
  .card .note{padding:0 9px 9px;margin-top:-2px;font-size:11.5px}
  .chk{top:10px;right:10px;width:26px;height:26px} .chk svg{width:14px;height:14px}
  .more{top:10px;left:10px;width:26px;height:26px;font-size:12px}
}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);
  transition:transform .18s ease, opacity .3s ease, filter .3s ease;user-select:none;-webkit-user-select:none;text-align:left;display:block;width:100%}
.card:active{transform:scale(.97)}
.tile{display:grid;place-items:center;overflow:hidden;position:relative}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.card .tile{aspect-ratio:1/1;font-size:clamp(46px,9vw,64px);border-radius:calc(var(--r) - 6px);margin:6px}
.card .meta{padding:2px 12px 12px;display:flex;align-items:center;gap:6px;min-height:40px}
.card .nm{font-weight:600;font-size:15px;line-height:1.2;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .qty{font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 8px;white-space:nowrap}
.card .note{padding:0 12px 12px;margin-top:-8px;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1.5px solid rgba(0,0,0,.12);display:grid;place-items:center;transition:all .2s}
.chk svg{width:16px;height:16px;opacity:0;transform:scale(.6);transition:all .2s}
.more{position:absolute;top:14px;left:14px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:grid;place-items:center;font-size:15px;color:#1b1a17;opacity:.9}
.card.done .chk{background:var(--accent);border-color:var(--accent)}
.card.done .chk svg{opacity:1;transform:scale(1)}
.card.done .tile{filter:grayscale(.9) opacity(.55)}
.card.done .nm{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.card.leaving{opacity:.0;transform:scale(.92)}
.li.leaving{opacity:0;transform:translateX(12px)}
.card.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9);opacity:.4}60%{transform:scale(1.03)}100%{transform:none;opacity:1}}
/* buy again strip */
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.again{flex:none;width:88px;scroll-snap-align:start;text-align:center}
.again .tile{width:88px;height:88px;border-radius:24px;font-size:40px;border:1px solid var(--line);position:relative}
.again .plus{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:15px;font-weight:700;box-shadow:var(--shadow);color:var(--accent)}
.again .l{font-size:12.5px;margin-top:6px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:34px 18px;text-align:center;color:var(--muted)}
.empty .big{font-family:'Instrument Serif',Georgia,serif;font-size:28px;color:var(--ink);margin-bottom:4px}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;padding:13px 18px;border-radius:15px;width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{width:auto;padding:9px 14px;font-size:13.5px;border-radius:12px}
.row{display:flex;gap:8px;align-items:center}
.row>.btn{flex:1}
/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(20,18,15,.38);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@media (min-width:700px){.backdrop{align-items:center}}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@media (min-width:700px){.sheet{border-radius:28px}}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:-4px auto 14px}
.sheet h3{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:30px;line-height:1.05;margin-bottom:4px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.field{width:100%;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);outline:none}
.field:focus{border-color:var(--accent)}
.hero{width:100%;aspect-ratio:4/3;border-radius:22px;font-size:96px;margin-bottom:12px}
.cats{display:flex;flex-wrap:wrap;gap:7px}
.cats button{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:13.5px;display:flex;align-items:center;gap:6px}
.cats button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.note-s{font-size:13px;color:var(--muted);margin-top:8px}
.steps{padding-left:20px;font-size:14px} .steps li{margin:7px 0}
code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--bg);border:1px solid var(--line);padding:1px 5px;border-radius:6px}
.box{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.box h4{font-size:15px;margin-bottom:4px}
.warn{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.switch input{width:46px;height:28px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;transition:.2s;flex:none}
.switch input::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--accent)} .switch input:checked::after{left:21px}
details summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none}
details summary::-webkit-details-marker{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;z-index:50;
  display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92%;animation:up .25s}
.toast button{color:var(--bg);font-weight:700;text-decoration:underline}
.basketbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hidden{display:none!important}
.sheet.wide{max-width:640px}
textarea.field{resize:none;line-height:1.45;display:block}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;padding:6px 12px calc(6px + env(safe-area-inset-bottom));
  background:var(--surface);background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tab{flex:1;max-width:190px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 3px;color:var(--muted);font-size:11.5px;font-weight:600;position:relative}
.tab .ic{width:60px;height:32px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent)} .tab.on .ic{background:var(--accent-soft)}
.tab .badge{position:absolute;top:2px;left:calc(50% + 12px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 5px}
/* timers */
.timerbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));z-index:19;display:flex;flex-direction:column;gap:6px;align-items:center;width:max-content;max-width:94%}
.tchip{background:var(--ink);color:var(--bg);border-radius:999px;padding:5px 5px 5px 14px;font-size:13.5px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:100%}
.tchip .tl{color:inherit;display:flex;gap:6px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tchip .tl b{font-variant-numeric:tabular-nums}
.tchip .tx{width:28px;height:28px;border-radius:50%;background:rgba(127,127,127,.3);color:inherit;flex:none}
/* recipe list */
.rsearch{margin:4px 0 14px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
@media (max-width:520px){.rgrid{grid-template-columns:1fr 1fr;gap:10px}}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);text-align:left;display:block;width:100%;transition:transform .18s}
.rcard:active{transform:scale(.97)}
.rcard .tile{aspect-ratio:4/3;margin:6px;border-radius:calc(var(--r) - 6px);font-size:58px}
.rcard .rn{font-family:'Instrument Serif',Georgia,serif;font-size:23px;line-height:1.05;padding:4px 12px 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rcard .rm{color:var(--muted);font-size:12.5px;padding:5px 12px 12px;display:flex;gap:4px 10px;flex-wrap:wrap}
@media (max-width:520px){.rcard .rn{font-size:20px;padding:2px 10px 0}.rcard .rm{padding:4px 10px 10px;font-size:11.5px}.rcard .tile{margin:5px;font-size:46px}}
/* recipe detail */
.rd{max-width:900px;margin:0 auto}
.rd-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 0 12px}
.back{display:inline-flex;align-items:center;gap:2px;font-weight:600;color:var(--accent);font-size:15.5px;padding:8px 6px 8px 0}
.rd-hero{width:100%;aspect-ratio:16/9;max-height:380px;border-radius:26px;font-size:110px;border:1px solid var(--line)}
@media (max-width:520px){.rd-hero{aspect-ratio:4/3;font-size:90px;border-radius:22px}}
.rd h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:44px;line-height:1;letter-spacing:-.01em;margin:18px 0 8px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.rd .desc{color:var(--muted);font-size:15.5px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin:18px 0 8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.fact .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.fact .v{font-weight:600;font-size:16px;margin-top:2px}
.fact .s{font-size:12px;color:var(--muted);margin-top:1px}
.cols{display:grid;gap:8px}
@media (min-width:820px){.cols{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:30px;align-items:start}.cols .ings{position:sticky;top:12px}}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.phead h2{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:28px}
.ing{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.ing:first-child{border-top:none}
.ing .q{font-weight:700;font-size:14px;min-width:62px;max-width:40%;font-variant-numeric:tabular-nums}
.ing .n{flex:1;min-width:0;overflow-wrap:anywhere}
.ing .n small{display:block;color:var(--muted);font-size:12.5px}
.ingbtn{font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent);white-space:nowrap;flex:none}
.ingbtn.on{background:var(--accent);color:var(--accent-ink)}
.ingbtn.bk{border-color:var(--line);color:var(--muted);cursor:default}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px}
.stepper button{width:30px;height:30px;border-radius:50%;font-size:18px;font-weight:600;display:grid;place-items:center;color:var(--accent)}
.stepper button:disabled{color:var(--faint)}
.stepper span{font-size:13px;font-weight:600;padding:0 6px;min-width:88px;text-align:center}
.step{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:none}
.step .num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:14px;transition:.2s}
.step.done .num{background:var(--accent);color:var(--accent-ink)}
.step.done .txt{color:var(--faint);text-decoration:line-through}
.step .txt{font-size:16px;line-height:1.5;padding-top:4px}
.tmr{margin-top:9px;display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line)}
.tmrs{margin-top:9px;display:inline-flex;align-items:center;background:var(--ink);color:var(--bg);border-radius:999px;font-size:13.5px;font-weight:700;padding:3px}
.tmrs button{color:inherit;padding:5px 10px;font-variant-numeric:tabular-nums}
.tmrs .tx{width:28px;height:28px;padding:0;border-radius:50%;background:rgba(127,127,127,.3)}
.tmrs.paused{background:var(--danger-soft);color:var(--danger)}
.muted{color:var(--muted)}
/* recipe editor */
.irow{display:flex;gap:6px;align-items:center;margin-top:6px}
.irow .field{padding:10px 12px;font-size:15.5px;min-width:0}
.irow .q{width:96px;flex:none}
.x{width:36px;height:36px;border-radius:12px;flex:none;color:var(--muted);font-size:15px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line)}
.x:disabled{opacity:.35}
.srow{display:flex;gap:10px;margin-top:12px;align-items:flex-start}
.srow .num{flex:none;width:28px;height:28px;margin-top:9px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:13px}
.sctl{display:flex;gap:6px;align-items:center;margin-top:6px}
.sctl .field{width:84px;padding:8px 10px;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;flex:none}
.seg button{padding:12px 14px;font-size:14px;font-weight:600;background:var(--bg)}
.seg button.on{background:var(--ink);color:var(--bg)}
/* aisle folders (to-get list) */
.ltools{display:flex;gap:8px;align-items:center}
.linkbtn{font-size:13px;font-weight:600;color:var(--accent);padding:6px 4px}
.seg.sm{border-radius:12px}
.seg.sm button{padding:7px 10px;display:grid;place-items:center;color:var(--muted)}
.seg.sm button.on{color:var(--bg)}
.seg.sm svg{width:17px;height:17px}
.aisles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:0 12px;align-items:start}
.aisle{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-top:10px;overflow:hidden}
.ahead{display:flex;align-items:center;gap:12px;width:100%;padding:9px 14px 9px 9px;text-align:left}
.aic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.an{flex:1;min-width:0}
.an b{display:block;font-size:15.5px;font-weight:700}
.an small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acount{min-width:26px;height:26px;border-radius:13px;background:var(--bg);border:1px solid var(--line);font-size:12.5px;font-weight:700;display:grid;place-items:center;padding:0 7px;flex:none}
.chev{color:var(--faint);transition:transform .2s;flex:none;display:grid;place-items:center}
.chev svg{width:18px;height:18px}
.aisle:not(.shut) .chev{transform:rotate(90deg)}
.aisle.shut .abody{display:none}
.aisle:not(.shut) .an small{display:none}
.abody{padding:0 8px 8px}
.abody.rows{padding:0}
.aisle .card{box-shadow:none;background:var(--bg)}
/* compact rows */
.li{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 10px;border-top:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none;transition:opacity .3s ease,transform .25s ease}
.abody.nohead .li:first-child{border-top:none}
.li:active{background:var(--bg)}
.li .tile{width:46px;height:46px;border-radius:13px;font-size:25px;flex:none}
.li .lt{flex:1;min-width:0}
.li .nm{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .ls{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .qty{font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 8px;white-space:nowrap;flex:none;max-width:30%;overflow:hidden;text-overflow:ellipsis}
.li .more{position:static;width:32px;height:32px;background:var(--bg);border:1px solid var(--line);color:var(--muted);font-size:11px;flex:none;opacity:1;backdrop-filter:none;-webkit-backdrop-filter:none}
.li .chk{position:static;flex:none;background:var(--surface);width:28px;height:28px}
.li .chk svg{width:15px;height:15px}
.li.done .chk{background:var(--accent);border-color:var(--accent)}
.li.done .chk svg{opacity:1;transform:scale(1)}
.li.done .tile{filter:grayscale(.9) opacity(.55)}
.li.done .nm{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.li.pop{animation:pop .35s ease}
/* buy-again folders */
.cat.sub{margin:14px 2px 8px}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px 12px}
@media (max-width:520px){.folders{grid-template-columns:repeat(3,1fr);gap:12px 10px}}
.folder{text-align:center;min-width:0}
.fbox{aspect-ratio:1/1;border-radius:24px;padding:9px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:7px;border:1px solid var(--line);transition:transform .18s}
.folder:active .fbox{transform:scale(.95)}
.fbox .tile{border-radius:12px;font-size:clamp(18px,5.4vw,27px);width:100%;height:100%;min-height:0;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.folder .fl{font-size:13px;font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder .fc{font-size:11.5px;color:var(--muted)}
.fhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.fhead h3{margin:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:14px 10px;margin-top:14px}
.fgrid .again{width:auto;min-width:0}
.fgrid .again .tile{width:100%;height:auto;aspect-ratio:1/1}
.fgrid .again.bk{opacity:.5;cursor:default}
.plus.on{background:var(--accent)!important;color:var(--accent-ink)!important}
</style>
</head>

<script>
/* ============ CATALOGUE ============ */
const CATS=[
  ['fruits','Fruits','🍎'],['veggies','Veggies','🥦'],['bakery','Bakery','🥖'],['dairy','Dairy & Eggs','🥛'],['cheese','Cheese','🧀'],['meat','Meat & Fish','🥩'],
  ['pasta','Pasta','🍝'],['pantry','Pantry','🫙'],['spices','Spices','🧂'],['frozen','Frozen','🧊'],['snacks','Snacks & Sweets','🍪'],['drinks','Drinks','🧃'],
  ['household','Household','🧽'],['personal','Personal care','🧴'],['other','Other','🛒']];
const CAT=Object.fromEntries(CATS.map(([k,n,e],i)=>[k,{n,e,i}]));
const GUESS=[
  [/ice ?cream|آيس ?كريم|ايس ?كريم/,'🍨','frozen'],[/coffee|قهوة/,'☕','drinks'],[/peanut butter|زبدة الفول/,'🥜','pantry'],[/coconut milk/,'🥥','pantry'],[/hot ?dog/,'🌭','meat'],
  [/tomato (paste|sauce)|معجون طماطم|صلصة طماطم/,'🥫','pantry'],
  [/baking (soda|powder)|bicarb|yeast|vanilla|cocoa|بيكنج|بيكربونات|خميرة|فانيلا|كاكاو/,'🧁','pantry'],
  [/pasta|spaghetti|macaroni|penne|fusilli|linguine|fettuccine|tagliatelle|lasagn|ravioli|tortellini|noodle|vermicelli|ramen|indomie|شعيرية|معكرونة|مكرونة|اسباجيتي|سباغيتي|لازانيا|اندومي|نودلز/,'🍝','pasta'],
  [/spice|black pepper|white pepper|pepper powder|(garlic|onion|ginger|chil+i|curry) powder|cumin|paprika|cinnamon|cardamom|turmeric|saffron|nutmeg|clove|oregano|thyme|bay lea|sumac|za'?atar|curry|masala|baharat|seasoning|بهارات|فلفل أسود|فلفل اسود|كمون|قرفة|هيل|كركم|زعفران|جوزة الطيب|قرنفل|زعتر|سماق|كاري|ورق غار|بابريكا/,'🧂','spices'],
  [/apple|تفاح/,'🍎','fruits'],[/banana|موز/,'🍌','fruits'],[/tomato|طماطم|بندورة/,'🍅','veggies'],[/cucumber|خيار/,'🥒','veggies'],
  [/lettuce|salad|spinach|greens|kale|cabbage|cauliflower|خس|سبانخ|جرجير|ملفوف|قرنبيط|زهرة/,'🥬','veggies'],[/onion|بصل/,'🧅','veggies'],[/garlic|ثوم/,'🧄','veggies'],[/potato|بطاطس|بطاطا/,'🥔','veggies'],
  [/carrot|جزر/,'🥕','veggies'],[/lemon|lime|ليمون/,'🍋','fruits'],[/orange|mandarin|برتقال|يوسفي/,'🍊','fruits'],[/grape|عنب/,'🍇','fruits'],
  [/strawberr|فراولة/,'🍓','fruits'],[/watermelon|بطيخ/,'🍉','fruits'],[/melon|شمام/,'🍈','fruits'],[/avocado|أفوكادو|افوكادو/,'🥑','fruits'],
  [/pomegranate|رمان/,'🍎','fruits'],[/okra|بامية/,'🥬','veggies'],
  [/pepper|capsicum|فلفل/,'🫑','veggies'],[/chil+i|jalape|حار/,'🌶️','veggies'],[/corn|ذرة/,'🌽','veggies'],[/mushroom|فطر|مشروم/,'🍄','veggies'],
  [/broccoli|بروكلي/,'🥦','veggies'],[/eggplant|aubergine|باذنجان/,'🍆','veggies'],[/peach|خوخ/,'🍑','fruits'],[/pear|كمثرى/,'🍐','fruits'],
  [/mango|مانجو/,'🥭','fruits'],[/pineapple|أناناس|اناناس/,'🍍','fruits'],[/cherr|كرز/,'🍒','fruits'],[/kiwi|كيوي/,'🥝','fruits'],
  [/coconut|جوز الهند/,'🥥','fruits'],[/blueberr|berr|توت/,'🫐','fruits'],[/ginger|زنجبيل/,'🫚','veggies'],
  [/mint|parsley|coriander|cilantro|basil|herb|dill|نعناع|بقدونس|كزبرة|ريحان|شبت/,'🌿','veggies'],[/zucchini|courgette|كوسا/,'🥒','veggies'],
  [/date|تمر/,'🌴','pantry'],[/bread|toast|baguette|bun|خبز|عيش|صامولي|توست/,'🍞','bakery'],[/croissant|كرواسون/,'🥐','bakery'],
  [/bagel/,'🥯','bakery'],[/pita|tortilla|wrap|تورتيلا|مرقوق/,'🫓','bakery'],[/cake|كيك/,'🍰','bakery'],
  [/cheese|cheddar|mozzarella|parmesan|parmigiano|halloumi|feta|ricotta|mascarpone|gouda|\bedam\b|brie|camembert|emmental|gruyere|burrata|paneer|kiri|puck|akkawi|nabulsi|جبن|جبنة|حلوم|موزاريلا|موزريلا|شيدر|بارميزان|فيتا|ريكوتا|كيري|بوك|عكاوي|نابلسي|قشقوان|كاشكفال/,'🧀','cheese'],
  [/milk|حليب/,'🥛','dairy'],[/laban|لبن|ayran/,'🥛','dairy'],[/egg|بيض/,'🥚','dairy'],
  [/butter|زبدة/,'🧈','dairy'],[/yog(h)?urt|زبادي|لبنة|labneh/,'🥣','dairy'],[/cream|قشطة|كريمة/,'🥛','dairy'],
  [/chicken|دجاج/,'🍗','meat'],[/beef|steak|lamb|mutton|meat|mince|لحم|غنم|كبدة/,'🥩','meat'],[/bacon/,'🥓','meat'],
  [/fish|salmon|tuna|hamour|سمك|سلمون|تونة|هامور/,'🐟','meat'],[/shrimp|prawn|روبيان|جمبري/,'🦐','meat'],[/sausage|hot ?dog|نقانق|سجق/,'🌭','meat'],
  [/rice|أرز|ارز|رز/,'🍚','pantry'],[/flour|طحين|دقيق/,'🌾','pantry'],
  [/sugar|سكر/,'🍬','pantry'],[/salt|ملح/,'🧂','spices'],[/oil|olive|زيت|زيتون/,'🫒','pantry'],[/honey|عسل/,'🍯','pantry'],
  [/bean|lentil|chickpea|فول|عدس|حمص/,'🫘','pantry'],[/can(ned)?\b|tin\b|معلبات/,'🥫','pantry'],[/cereal|oat|granola|شوفان|كورن فليكس/,'🥣','pantry'],
  [/nut|almond|cashew|pistachio|peanut|مكسرات|لوز|كاجو|فستق/,'🥜','snacks'],
  [/ketchup|mayo|mustard|sauce|كاتشب|مايونيز|صلصة/,'🥫','pantry'],[/jam|مربى/,'🍓','pantry'],[/tahini|طحينة/,'🫙','pantry'],
  [/coffee|قهوة|بن\b/,'☕','drinks'],[/tea|شاي/,'🍵','drinks'],[/water|ماء|مياه/,'💧','drinks'],[/juice|عصير/,'🧃','drinks'],
  [/soda|\bcola\b|coca|pepsi|7up|sprite|غازي|بيبسي/,'🥤','drinks'],
  [/chocolate|شوكولاتة|شوكولاته|nutella/,'🍫','snacks'],[/cookie|biscuit|بسكويت/,'🍪','snacks'],[/chips|crisps|شيبس/,'🥔','snacks'],
  [/ice ?cream|آيس|ايس كريم/,'🍨','frozen'],[/frozen|مجمد|مثلج/,'🧊','frozen'],[/pizza|بيتزا/,'🍕','frozen'],[/candy|sweet|حلويات|حلاوة/,'🍬','snacks'],
  [/popcorn|فشار/,'🍿','snacks'],
  [/tissue|toilet|kleenex|paper towel|مناديل|محارم|ورق/,'🧻','household'],[/dish|detergent|bleach|cleaner|clorox|منظف|صابون صحون|كلوركس|تايد|tide/,'🧴','household'],
  [/sponge|اسفنج|ليفة/,'🧽','household'],[/trash|garbage|bin bag|أكياس|اكياس/,'🗑️','household'],[/foil|wrap|قصدير/,'🧻','household'],[/batter|بطارية/,'🔋','household'],
  [/bulb|لمبة/,'💡','household'],[/candle|شمع/,'🕯️','household'],
  [/soap|shower|body wash|صابون|شاور/,'🧼','personal'],[/shampoo|conditioner|شامبو|بلسم/,'🧴','personal'],[/tooth|معجون|فرشاة/,'🪥','personal'],
  [/razor|shav|حلاقة|موس/,'🪒','personal'],[/deodorant|مزيل/,'🧴','personal'],[/diaper|حفاض|حفائض|pampers/,'👶','personal'],[/baby|formula|طفل|حليب أطفال/,'🍼','personal'],
  [/medicine|vitamin|panadol|دواء|فيتامين|بنادول/,'💊','personal'],[/cotton|قطن/,'☁️','personal'],
];
function guess(name){const n=String(name||'').toLowerCase();for(const [re,e,c] of GUESS)if(re.test(n))return {e,c};return {e:null,c:'other'};}
const emojiOf=it=>it.em||guess(it.name).e||CAT[it.cat||'other']?.e||'🛒';

/* ============ STATE ============ */
const LS='salla-v1', CFG='salla-sync', PIMG='salla-pimg', GIMG='salla-gimg';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
let D={items:{},del:{},recipes:{},rdel:{}};
// Old "Fruit & Veg" (produce) → Fruits or Veggies; unknown categories → Other. Deterministic, so every device agrees.
function normCats(d){for(const it of Object.values(d.items||{})){
  if(it.cat==='produce') it.cat=guess(it.name).c==='fruits'?'fruits':'veggies';
  else if(!CAT[it.cat]) it.cat='other';
}}
// One-time moves into newer categories (only items still in the old category, so manual choices elsewhere are kept).
const MIGRATIONS=[['salla-cats2','pantry',['pasta','spices']],['salla-cats3','dairy',['cheese']]];
function migrateCats(){
  let n=0;
  for(const [flag,from,to] of MIGRATIONS){
    if(lsGet(flag,false)) continue;
    for(const it of items()){ if(it.cat!==from) continue; const g=guess(it.name).c; if(to.includes(g)){touch(it,{cat:g});n++;} }
    lsSet(flag,true);
  }
  if(n){saveLocal();dirty=true;}
}
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j&&j.items)D={items:j.items,del:j.del||{},recipes:j.recipes||{},rdel:j.rdel||{}};}catch(e){} normCats(D);}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(D));}catch(e){}}
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
let dirty=false;
function commit(){saveLocal();dirty=true;render();scheduleSync();}
const items=()=>Object.values(D.items);
const findByName=n=>items().find(i=>norm(i.name)===norm(n));
function touch(it,patch){Object.assign(it,patch,{u:Date.now()});}

/* ============ IMAGES (IndexedDB cache) ============ */
let idb=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('salla',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>{idb=r.result;res(idb)};r.onerror=()=>res(null);}catch(e){res(null)}});}
function idbGet(k){return new Promise(res=>{if(!idb)return res(null);try{const q=idb.transaction('img').objectStore('img').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null)}});}
function idbPut(k,v){return new Promise(res=>{if(!idb)return res();try{const t=idb.transaction('img','readwrite');t.objectStore('img').put(v,k);t.oncomplete=()=>res();t.onerror=()=>res();}catch(e){res()}});}
const memImg=new Map(), loadingImg=new Set();
async function ensureImg(id){
  if(!id||memImg.has(id)||loadingImg.has(id)) return;
  loadingImg.add(id);
  let url=await idbGet(id);
  if(!url&&cfgOK()){ try{ url=await fetchRemoteImg(id); if(url) await idbPut(id,url); }catch(e){} }
  loadingImg.delete(id);
  if(url){ memImg.set(id,url); document.querySelectorAll(`[data-img="${id}"]`).forEach(el=>{el.innerHTML=`<img alt="" src="${url}">`;}); }
}
function imgTile(img,bg,em,cls=''){
  if(img){ const u=memImg.get(img); if(!u) setTimeout(()=>ensureImg(img)); return `<div class="tile ${cls}" style="background:${bg}" data-img="${esc(img)}">${u?`<img alt="" src="${u}">`:`<span>${esc(em)}</span>`}</div>`; }
  return `<div class="tile ${cls}" style="background:${bg}"><span>${esc(em)}</span></div>`;
}
function tile(it,cls=''){ return imgTile(it.img, CAT[it.cat]?'var(--t-'+it.cat+')':'var(--t-other)', emojiOf(it), cls); }
function compressImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{ const S=640, s=Math.min(im.naturalWidth,im.naturalHeight); const c=document.createElement('canvas'); c.width=c.height=Math.min(S,s);
      const ctx=c.getContext('2d'); ctx.drawImage(im,(im.naturalWidth-s)/2,(im.naturalHeight-s)/2,s,s,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.8)); };
    im.onerror=()=>{URL.revokeObjectURL(url);rej();}; im.src=url;
  });
}

/* ============ CRYPTO (AES-256-GCM, PBKDF2) ============ */
const te=new TextEncoder(), td=new TextDecoder();
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);};
const unb64=s=>{const bin=atob(String(s).replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;};
const keys=new Map();
async function getKey(salt,iter){
  const id=cfg.pass+'|'+salt+'|'+iter; if(keys.has(id)) return keys.get(id);
  const p=(async()=>{const base=await crypto.subtle.importKey('raw',te.encode(cfg.pass),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(salt),iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);})();
  keys.set(id,p); p.catch(()=>keys.delete(id)); return p;
}
function mySalt(){let s=lsGet('salla-salt',null);if(!s){s=b64(crypto.getRandomValues(new Uint8Array(16)));lsSet('salla-salt',s);}return s;}
async function encrypt(obj){
  const salt=mySalt(), iter=310000, key=await getKey(salt,iter), iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj))));
  return JSON.stringify({app:'salla',v:1,cipher:'AES-256-GCM',kdf:'PBKDF2-SHA256',iter,salt,iv:b64(iv),ct:b64(ct)});
}
async function decrypt(text){
  let env; try{env=JSON.parse(text);}catch(e){throw {code:'format'};}
  if(!env||env.app!=='salla'||!env.ct) throw {code:'format'};
  try{ const key=await getKey(env.salt,env.iter); const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},key,unb64(env.ct)); return JSON.parse(td.decode(pt)); }
  catch(e){ throw {code:'pass'}; }
}

/* ============ GITHUB SYNC ============ */
let cfg=lsGet(CFG,null);
const cfgOK=()=>!!(cfg&&cfg.repo&&cfg.token&&cfg.pass);
async function gh(path,opts={},extra={}){
  let r;
  try{ r=await fetch(`https://api.github.com/repos/${cfg.repo}${path}`,{...opts,cache:'no-store',headers:{
      'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',
      ...(opts.body?{'Content-Type':'application/json'}:{}),...extra}}); }
  catch(e){ throw {code:'net'}; }
  if(r.status===401) throw {code:'token'};
  return r;
}
let etag=null, lastSha=null;
async function pull(conditional){
  const r=await gh('/contents/data.json',{},conditional&&etag&&lastSha?{'If-None-Match':etag}:{});
  if(r.status===304) return {notModified:true};
  if(r.status===404){ const rr=await gh(''); if(rr.ok) return {data:null,sha:null}; throw {code:'repo'}; }
  if(r.status===403) throw {code:'perm'};
  if(!r.ok) throw {code:'net'};
  const tag=r.headers.get('ETag'); const j=await r.json(); let content=j.content;
  if(!content&&j.sha){ const b=await gh('/git/blobs/'+j.sha); if(!b.ok) throw {code:'net'}; content=(await b.json()).content; }
  const data=await decrypt(td.decode(unb64(content||'')));
  etag=tag; return {data,sha:j.sha};
}
async function push(data,sha){
  const body={message:'Salla sync',content:b64(te.encode(await encrypt(data)))}; if(sha) body.sha=sha;
  const r=await gh('/contents/data.json',{method:'PUT',body:JSON.stringify(body)});
  if(r.status===409||r.status===422) throw {code:'conflict'};
  if(r.status===403||r.status===404) throw {code:'perm'};
  if(!r.ok) throw {code:'net'};
  const j=await r.json(); etag=null; return j.content&&j.content.sha;
}
async function fetchRemoteImg(id){
  const r=await gh('/contents/img/'+id+'.json'); if(!r.ok) return null;
  const j=await r.json(); let content=j.content;
  if(!content&&j.sha){ const b=await gh('/git/blobs/'+j.sha); if(!b.ok) return null; content=(await b.json()).content; }
  const o=await decrypt(td.decode(unb64(content||''))); return o&&o.url;
}
async function uploadImgs(){
  const pend=lsGet(PIMG,[]); if(!pend.length) return;
  for(const id of [...pend]){
    const url=memImg.get(id)||await idbGet(id);
    if(url){ const r=await gh('/contents/img/'+id+'.json',{method:'PUT',body:JSON.stringify({message:'Salla photo',content:b64(te.encode(await encrypt({url})))})});
      if(!(r.ok||r.status===422)) continue; }
    const cur=lsGet(PIMG,[]); lsSet(PIMG,cur.filter(x=>x!==id));
  }
}
async function gcImgs(){
  const g=lsGet(GIMG,[]); if(!g.length) return;
  const inUse=new Set([...items(),...Object.values(D.recipes||{})].map(i=>i.img).filter(Boolean));
  for(const id of g){
    if(!inUse.has(id)){ try{ const r=await gh('/contents/img/'+id+'.json'); if(r.ok){const j=await r.json(); await gh('/contents/img/'+id+'.json',{method:'DELETE',body:JSON.stringify({message:'Salla remove photo',sha:j.sha})});} }catch(e){ if(e.code==='net') continue; } }
    lsSet(GIMG,lsGet(GIMG,[]).filter(x=>x!==id));
  }
}
function mergeMap(aMap,bMap,aDel,bDel){
  const del={...(bDel||{})}; for(const [k,v] of Object.entries(aDel||{})) del[k]=Math.max(v,del[k]||0);
  const out={};
  for(const src of [bMap||{},aMap||{}]) for(const [id,it] of Object.entries(src)){
    if(del[id]&&del[id]>=(it.u||0)) continue;
    const p=out[id]; if(!p||(it.u||0)>(p.u||0)) out[id]=it;
  }
  for(const k of Object.keys(del)) if(out[k]) delete del[k];
  return [out,del];
}
// List items and recipes merge independently: newest edit wins, deletions are remembered.
function merge(a,b){
  const [items,del]=mergeMap(a.items,b.items,a.del,b.del);
  const [recipes,rdel]=mergeMap(a.recipes,b.recipes,a.rdel,b.rdel);
  return {items,del,recipes,rdel};
}
const SYNC_MSG={token:'Token not accepted',repo:'Repo not found',perm:'No write access',pass:'Wrong passphrase',format:'Not a Salla file',net:'Offline',conflict:'Retrying…'};
let syncing=false, syncAgain=false, syncTimer=null, syncErr=null, lastOk=0;
function setSync(){
  const el=$('#sync'); let cls='',txt='This device';
  if(cfgOK()){ if(syncing){cls='busy';txt='Syncing';} else if(syncErr){cls='off';txt=SYNC_MSG[syncErr]||'Sync error';} else {cls='on';txt='Synced';} }
  el.innerHTML=`<span class="dot ${cls}"></span><span>${esc(txt)}</span>`;
}
function scheduleSync(){ if(!cfgOK()) return; clearTimeout(syncTimer); syncTimer=setTimeout(syncNow,900); }
async function syncNow(){
  if(!cfgOK()) return;
  if(syncing){ syncAgain=true; return; }
  syncing=true; clearTimeout(syncTimer); if(!lastOk) setSync();
  try{
    for(let attempt=0;;attempt++){
      const res=await pull(attempt===0);
      if(res.notModified){ if(!dirty) break; }
      else{
        lastSha=res.sha;
        const before=JSON.stringify(D);
        const merged=res.data?merge(JSON.parse(before),res.data):merge(JSON.parse(before),{items:{},del:{}});
        normCats(merged);
        if(JSON.stringify(merged)!==before){ D=merged; saveLocal(); render(); }
        if(res.data&&JSON.stringify(merge(res.data,res.data))===JSON.stringify(D)){ dirty=false; break; }
      }
      dirty=false;
      try{ lastSha=await push(D,lastSha); break; }
      catch(e){ dirty=true; if(e.code!=='conflict'||attempt>=4) throw e; etag=null; }
    }
    await uploadImgs(); await gcImgs();
    syncErr=null; lastOk=Date.now();
  }catch(e){ syncErr=(e&&e.code)||'net'; }
  syncing=false; setSync();
  if(syncAgain){ syncAgain=false; syncNow(); }
}
setInterval(()=>{ if(document.visibilityState==='visible') syncNow(); },8000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ syncNow(); wake(); } });
window.addEventListener('online',()=>syncNow());

function parseEntry(raw){
  let s=raw.trim(); if(!s) return null; let qty='';
  let m=s.match(/^(\d+(?:[.,]\d+)?\s*(?:kg|g|gm|l|ltr|ml|pcs|pc|x|packs?|bags?|boxes?|كيلو|كغ|غرام|لتر|حبة|حبات|علب?ة?)?)\s+(.+)$/i);
  if(m){qty=m[1].trim();s=m[2];}
  else if((m=s.match(/^(.+?)\s+(?:x\s*)?(\d+(?:[.,]\d+)?\s*(?:kg|g|gm|l|ltr|ml|pcs|pc|packs?|كيلو|لتر|حبة|حبات)?)$/i))){s=m[1];qty=m[2].trim();}
  s=s.replace(/^x\s*/i,'').trim(); if(!s) return null;
  return {name:s.charAt(0).toUpperCase()+s.slice(1),qty};
}
function addItem(name,qty){
  const ex=findByName(name);
  if(ex){
    if(ex.on&&!ex.ck){ if(qty) touch(ex,{qty}); justAdded=ex.id; flash(ex.id); toast(`${ex.name} is already on the list`); return ex; }
    touch(ex,{on:true,ck:false,uses:(ex.uses||0)+1,at:Date.now(),...(qty?{qty}:{})}); justAdded=ex.id; return ex;
  }
  const g=guess(name); const it={id:uid(),name,qty:qty||'',note:'',cat:g.c,img:null,on:true,ck:false,uses:1,at:Date.now(),u:Date.now()};
  D.items[it.id]=it; justAdded=it.id; return it;
}
let justAdded=null;
function addFromInput(){
  const v=$('#addInput').value; const parts=v.split(/[,،\n]+/).map(parseEntry).filter(Boolean);
  if(!parts.length) return;
  for(const p of parts) addItem(p.name,p.qty);
  $('#addInput').value=''; $('#suggest').innerHTML=''; commit();
}
function toggle(id){
  const it=D.items[id]; if(!it) return;
  const card=document.querySelector(`.card[data-id="${id}"],.li[data-id="${id}"]`);
  touch(it,{ck:!it.ck}); saveLocal(); dirty=true; scheduleSync();
  if(card){ card.classList.toggle('done',it.ck); setTimeout(()=>{card.classList.add('leaving'); setTimeout(render,180);},420); }
  else render();
  if(it.ck&&listItems().length===0) setTimeout(()=>toast('Everything is in the basket ✨'),700);
}
function clearBasket(){
  const ids=items().filter(i=>i.on&&i.ck).map(i=>i.id); if(!ids.length) return;
  ids.forEach(id=>touch(D.items[id],{on:false,ck:false})); commit();
  toast(`Cleared ${ids.length} item${ids.length===1?'':'s'}`,'Undo',()=>{ids.forEach(id=>D.items[id]&&touch(D.items[id],{on:true,ck:true}));commit();});
}
function flash(id){const c=document.querySelector(`.card[data-id="${id}"],.li[data-id="${id}"]`);if(c){c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');c.scrollIntoView({behavior:'smooth',block:'center'});}}

let toastT;

  const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<span>${esc(msg)}</span>${action?`<button>${esc(action)}</button>`:''}`;

/* ============ RECIPES ============ */
let view={tab:lsGet('salla-tab','list')==='recipes'?'recipes':'list', rid:lsGet('salla-rid',null)};
const cookSt={};   // per-recipe cooking state on this device: done steps, chosen servings

const RBG=['fruits','veggies','bakery','dairy','cheese','pasta','spices','drinks','snacks','frozen','personal'];

  [/sandwich|shawarma|ساندويتش|شاورما/,'🥪'],[/chicken|دجاج/,'🍗'],[/fish|salmon|shrimp|prawn|سمك|سلمون|روبيان|جمبري/,'🐟'],[/steak|beef|lamb|لحم/,'🥩'],
  [/\beggs?\b|omelet|shakshuka|بيض|شكشوكة|عجة/,'🍳'],[/\brice\b|رز|أرز/,'🍚'],[/taco|burrito/,'🌮'],[/dessert|pudding|kunafa|basbousa|حلى|كنافة|بسبوسة|مهلبية/,'🍮'],
  [/smoothie|juice|عصير|سموذي/,'🥤'],[/coffee|latte|قهوة/,'☕']];
const rEmoji=r=>(r.em&&r.em.trim())||(RGUESS.find(([re])=>re.test(String(r.name||'').toLowerCase()))||[])[1]||'🍲';
function hashStr(s){let h=0;for(const c of String(s))h=(h*31+c.codePointAt(0))|0;return Math.abs(h);}
const rtile=(r,cls='')=>imgTile(r.img,`var(--t-${RBG[hashStr(r.id||r.name)%RBG.length]})`,rEmoji(r),cls);
const OVEN={conv:'Conventional',fan:'Fan',grill:'Grill',air:'Air fryer'};

/* --- quantities: parse, scale, format --- */
const FR={'½':.5,'⅓':1/3,'⅔':2/3,'¼':.25,'¾':.75,'⅛':.125};
const NUM_SRC='(?:\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:[.,]\\d+)?(?:\\s?[½⅓⅔¼¾⅛])?|[½⅓⅔¼¾⅛])';
const UNIT_SRC='(?:kg|g|gm|grams?|mg|ml|l|ltr|litres?|liters?|cups?|tbsps?|tsps?|tablespoons?|teaspoons?|oz|ounces?|lbs?|pounds?|pinch(?:es)?|cloves?|cans?|tins?|slices?|handfuls?|pieces?|pcs|pc|bunch(?:es)?|packs?|packets?|sticks?|sprigs?|dash(?:es)?|x|كوب|أكواب|اكواب|ملعقة كبيرة|ملعقة صغيرة|ملاعق كبيرة|ملاعق صغيرة|ملعقة|ملاعق|غرام|غم|جم|كيلو|كغ|لتر|مل|حبة|حبات|رشة|فص|فصوص|علبة|علب|ربطة|شريحة|شرائح)';
const ING_RE=new RegExp(`^(${NUM_SRC}(?:\\s*[-–]\\s*${NUM_SRC})?(?:\\s*${UNIT_SRC}(?=[\\s.]|$)\\.?)?)\\s*(?:of\\s+)?(.+)$`,'i');
const SCALE_RE=new RegExp(`^\\s*(${NUM_SRC})(?:\\s*([-–])\\s*(${NUM_SRC}))?(.*)$`);
function toNum(t){
  t=String(t).trim().replace(',','.'); let m;
  if((m=t.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[3]?+m[1]+m[2]/m[3]:NaN;
  if((m=t.match(/^(\d+)\/(\d+)$/))) return +m[2]?m[1]/m[2]:NaN;
  if((m=t.match(/^(\d+(?:\.\d+)?)?\s?([½⅓⅔¼¾⅛])$/))) return (m[1]?+m[1]:0)+FR[m[2]];
  return +t;
}
function fmtNum(n){
  if(!isFinite(n)||n<=0) return null;
  if(n>=10) return String(Math.round(n));
  const w=Math.floor(n), f=n-w; let best=null;
  for(const [v,s] of [[0,''],[.125,'⅛'],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾'],[1,'']])
    if(Math.abs(f-v)<=.04&&(!best||Math.abs(f-v)<Math.abs(f-best[0]))) best=[v,s];
  if(best){ const W=best[0]===1?w+1:w; if(!W&&!best[1]) return String(Math.round(n*100)/100); return (W?String(W):'')+best[1]; }
  return String(Math.round(n*10)/10);
}
function scaleQty(q,f){
  q=String(q||''); if(!q||Math.abs(f-1)<1e-9) return q;
  const m=q.match(SCALE_RE); if(!m) return q;
  const a=fmtNum(toNum(m[1])*f); if(!a) return q;
  let out=a; if(m[3]){ const b=fmtNum(toNum(m[3])*f); if(!b) return q; out+=m[2]+b; }
  return out+m[4];
}
function parseIng(raw){
  let s=String(raw||'').replace(/^\s*(?:[-*•·▪◦–]|\d+[.)])\s+/,'').trim(); if(!s) return null;
  let qty='', name=s, m;
  if((m=s.match(ING_RE))){ qty=m[1].trim(); name=m[2]; }
  else if((m=s.match(/^((?:a|an|one)\s+(?:pinch|dash|handful|splash|few|couple|little|knob|sprig|bunch|clove)(?:es|s)?)\s+(?:of\s+)?(.+)$/i))){ qty=m[1]; name=m[2]; }
  name=name.trim(); if(!name) return null;
  return {id:uid(),qty,name:name.charAt(0).toUpperCase()+name.slice(1)};
}
const ingBase=n=>String(n||'').split(/[,،(]/)[0].trim()||String(n||'').trim();
const ingNote=n=>{const s=String(n||''); const i=s.search(/[,،(]/); return i>0?s.slice(i).replace(/^[,،]\s*/,'').trim():'';};
const keyVariants=s=>{const n=norm(s); return [n,n.replace(/s$/,''),n.replace(/es$/,'')];};
function findItemFuzzy(name){
  const exact=findByName(name); if(exact) return exact;
  const v=new Set(keyVariants(name)); return items().find(i=>keyVariants(i.name).some(x=>v.has(x)));
}
function ingStatus(g){ const it=findItemFuzzy(ingBase(g.name)); return !it||!it.on?'none':(it.ck?'basket':'list'); }
const fmtMin=m=>{m=Math.round(+m||0); if(m<=0) return ''; const h=Math.floor(m/60), r=m%60; return h?`${h} h${r?` ${r} min`:''}`:`${r} min`;};
const numOrNull=v=>{const n=parseFloat(String(v).replace(',','.')); return isFinite(n)&&n>0?Math.round(n*10)/10:null;};
function ovenLine(r){ const o=r.oven; if(!o||!OVEN[o.mode]) return ''; return `${OVEN[o.mode]}${o.temp?` ${o.temp}°${o.unit==='F'?'F':'C'}`:''}`; }
function cookState(r){
  const c=cookSt[r.id]||(cookSt[r.id]={done:new Set(),serves:null});
  if(!r.serves) c.serves=null; else if(!c.serves) c.serves=r.serves;
  return c;
}
const factorOf=(r,c)=>r.serves&&c.serves?c.serves/r.serves:1;

function renderRecipeDetail(r){

    return `<div class="step ${done?'done':''}"><button class="num" data-sdone="${esc(s.id)}" aria-label="Mark step ${i+1} done">${done?'✓':i+1}</button><div style="flex:1;min-width:0"><div class="txt pre">${esc(s.text)}</div>${s.timer?timerHTML(r.id+':'+s.id,s.timer):''}</div></div>`;
  }).join(''):`<p class="muted" style="font-size:14px">No steps yet. Tap Edit to write the method.</p>`;

    ${rtile(r,'rd-hero')}

      </div>
      <div>
        <div class="phead"><h2>Method</h2>${steps.length?`<span class="note-s" style="margin:0">Tap a number when done</span>`:''}</div>
        <div>${stepHTML}</div>
        ${r.notes?`<div class="box"><h4>Tips & notes</h4><div class="pre" style="font-size:14.5px;margin-top:4px">${esc(r.notes)}</div></div>`:''}
        ${src?`<p class="note-s" style="margin-top:14px">Source: ${src}</p>`:''}
      </div>
    </div></div>`;
}

/* --- add ingredients to the shopping list --- */
function undoSnap(snap){
  const now=Date.now();
  for(const [id,s] of Object.entries(snap)){ if(s===null){ if(D.items[id]){ delete D.items[id]; D.del[id]=now; } } else D.items[id]={...s,u:now}; }
  commit();
}
function ingAdd(r,idxs){
  const f=factorOf(r,cookState(r)), snap={}, names=[];
  for(const i of idxs){
    const g=(r.ingredients||[])[i]; if(!g) continue;
    const base=ingBase(g.name), q=scaleQty(g.qty,f), ex=findItemFuzzy(base);
    if(ex&&ex.on) continue;
    if(ex){ snap[ex.id]=JSON.parse(JSON.stringify(ex)); touch(ex,{on:true,ck:false,uses:(ex.uses||0)+1,at:Date.now(),...(q?{qty:q}:{})}); names.push(ex.name); }
    else { const it=addItem(base,q); it.note=`For ${r.name}`; snap[it.id]=null; names.push(it.name); }
  }
  if(!names.length) return;
  justAdded=null; commit();
  toast(names.length===1?`Added ${names[0]} to your list`:`Added ${names.length} items to your list`,'Undo',()=>undoSnap(snap));
}
function ingRemove(r,i){
  const g=(r.ingredients||[])[i]; if(!g) return;
  const ex=findItemFuzzy(ingBase(g.name)); if(!ex||!ex.on||ex.ck) return;
  const s=JSON.parse(JSON.stringify(ex)); touch(ex,{on:false,ck:false}); commit();
  toast(`Removed ${ex.name} from your list`,'Undo',()=>undoSnap({[ex.id]:s}));
}

/* --- copy as text --- */
function recipeText(r){
  const L=[r.name];
  if(r.desc) L.push('',r.desc);
  const facts=[r.serves&&`Serves ${r.serves}`,r.prep&&`Prep ${fmtMin(r.prep)}`,r.cook&&`Cook ${fmtMin(r.cook)}`,ovenLine(r),r.diff].filter(Boolean);
  if(facts.length) L.push('',facts.join(' · '));
  if((r.ingredients||[]).length){ L.push('','Ingredients'); r.ingredients.forEach(g=>L.push(`- ${g.qty?g.qty+' ':''}${g.name}`)); }
  if((r.steps||[]).length){ L.push('','Method'); r.steps.forEach((s,i)=>L.push(`${i+1}. ${s.text}${s.timer?` (${fmtMin(s.timer)})`:''}`)); }
  if(r.notes) L.push('','Tips & notes',r.notes);
  if(r.source) L.push('',`Source: ${r.source}`);
  return L.join('\n');
}
async function copyRecipe(r){
  const t=recipeText(r);
  try{ await navigator.clipboard.writeText(t); toast('Recipe copied, ready to paste'); }
  catch(e){ sheet(`<h3>Copy recipe</h3><textarea class="field" style="margin-top:12px;min-height:260px" readonly>${esc(t)}</textarea>`,el=>{const ta=el.querySelector('textarea');ta.focus();ta.select();}); }
}

/* --- cooking timers --- */
const timers=new Map(); let tickT=null, actx=null;
const remaining=t=>t.paused!=null?t.paused:Math.max(0,t.end-Date.now());
function fmtClock(ms){ const s=Math.ceil(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0'); }
function unlockAudio(){ try{ if(!actx){ const A=window.AudioContext||window.webkitAudioContext; if(A) actx=new A(); } if(actx&&actx.state==='suspended') actx.resume(); }catch(e){} }
function beep(){
  if(!actx) return;
  try{ const t0=actx.currentTime+.05;
    for(let i=0;i<4;i++){ const o=actx.createOscillator(), g=actx.createGain(), s=t0+i*.45; o.type='sine'; o.frequency.value=i%2?660:880;
      g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.4,s+.02); g.gain.exponentialRampToValueAtTime(.0001,s+.35);
      o.connect(g); g.connect(actx.destination); o.start(s); o.stop(s+.4); } }catch(e){}
}
function startTimer(key,min){
  const [rid,sid]=key.split(':'); const r=D.recipes[rid]; if(!r||!(min>0)) return;
  const i=(r.steps||[]).findIndex(s=>s.id===sid);
  unlockAudio(); timers.set(key,{label:`Step ${i+1} · ${r.name}`,end:Date.now()+min*60000,paused:null}); timersChanged();
}
function pauseTimer(key){ const t=timers.get(key); if(!t) return; if(t.paused!=null){ t.end=Date.now()+t.paused; t.paused=null; } else t.paused=remaining(t); timersChanged(); }
function stopTimer(key){ timers.delete(key); timersChanged(); }
function timersChanged(){ render(); if(timers.size&&!tickT) tickT=setInterval(tick,500); if(!timers.size&&tickT){ clearInterval(tickT); tickT=null; } }
function tick(){
  const fin=[];
  for(const [k,t] of timers){ const ms=remaining(t); if(ms<=0&&t.paused==null) fin.push(k); document.querySelectorAll(`[data-tm="${k}"]`).forEach(el=>el.textContent=fmtClock(ms)); }
  if(!fin.length) return;
  for(const k of fin){ const t=timers.get(k); timers.delete(k); beep(); try{navigator.vibrate&&navigator.vibrate([400,200,400,200,400]);}catch(e){} toast(`⏰ Time's up: ${t.label}`,'OK',()=>{}); }
  timersChanged();
}
function renderTimerBar(){
  const open=view.tab==='recipes'?view.rid:null;
  $('#timerbar').innerHTML=[...timers].filter(([k])=>k.split(':')[0]!==open).map(([k,t])=>
    `<div class="tchip"><button class="tl" data-topen="${esc(k)}">⏱ <b data-tm="${esc(k)}">${fmtClock(remaining(t))}</b>${t.paused!=null?' · paused':''} · <span style="overflow:hidden;text-overflow:ellipsis">${esc(t.label)}</span></button><button class="tx" data-tstop="${esc(k)}" aria-label="Stop timer">✕</button></div>`).join('');
}

/* --- clicks --- */
function recipeClick(e){
  const at=s=>e.target.closest(s);
  let b;
  if((b=at('[data-tab]'))){ setTab(b.dataset.tab); return true; }
  if((b=at('[data-tstart]'))){ startTimer(b.dataset.tstart,+b.dataset.min); return true; }
  if((b=at('[data-tpause]'))){ pauseTimer(b.dataset.tpause); return true; }
  if((b=at('[data-tstop]'))){ stopTimer(b.dataset.tstop); return true; }
  if((b=at('[data-topen]'))){ const rid=b.dataset.topen.split(':')[0]; view.tab='recipes'; lsSet('salla-tab','recipes'); openRecipe(rid); return true; }
  if(at('[data-rnew]')){ recipeEditor(null); return true; }
  if((b=at('[data-rid]'))){ openRecipe(b.dataset.rid); return true; }
  if(!$('#tabRecipes').contains(e.target)) return false;
  const r=view.rid&&D.recipes[view.rid];
  if(at('[data-rback]')){ openRecipe(null); return true; }
  if(!r) return false;
  if(at('[data-redit]')){ recipeEditor(r.id); return true; }
  if(at('[data-rcopy]')){ copyRecipe(r); return true; }
  if((b=at('[data-ingadd]'))){ ingAdd(r,[+b.dataset.ingadd]); return true; }
  if((b=at('[data-ingrm]'))){ ingRemove(r,+b.dataset.ingrm); return true; }
  if(at('[data-ingall]')){ ingAdd(r,(r.ingredients||[]).map((_,i)=>i)); return true; }
  if((b=at('[data-srv]'))){ const c=cookState(r); c.serves=Math.min(99,Math.max(1,c.serves+ +b.dataset.srv)); renderRecipes(); return true; }
  if((b=at('[data-sdone]'))){ const c=cookState(r), id=b.dataset.sdone; c.done.has(id)?c.done.delete(id):c.done.add(id); renderRecipes(); return true; }
  return false;
}

/* --- editor --- */
function recipeEditor(id){
  const orig=id?D.recipes[id]:null; if(id&&!orig) return;
  const rid=orig?orig.id:uid();
  const blank={name:'',em:'',img:null,desc:'',serves:null,prep:null,cook:null,diff:'',oven:{mode:'none',temp:null,unit:'C'},ingredients:[],steps:[],notes:'',source:''};
  const d=JSON.parse(JSON.stringify(orig?{...blank,...orig,oven:{...blank.oven,...(orig.oven||{})}}:blank));
  for(const k of ['name','em','desc','notes','source','diff']) d[k]=String(d[k]??'');
  if(!d.steps.length) d.steps.push({id:uid(),text:'',timer:null});
  const start=JSON.stringify(d);
  sheet(`<h3>${orig?'Edit recipe':'New recipe'}</h3>
    <div id="r-hero" style="margin-top:12px"></div>
    <div class="row"><button class="btn sm ghost" data-ed="photo">📷 <span id="r-phl"></span></button><button class="btn sm ghost" data-ed="rmphoto" id="r-rmph">Remove photo</button></div>
    <div class="row" style="gap:10px;align-items:flex-start">
      <div style="flex:1;min-width:0"><label>Recipe name</label><input class="field" data-f="name" placeholder="e.g. Chicken kabsa" autocapitalize="sentences"></div>
      <div style="width:90px"><label>Emoji</label><input class="field" data-f="em" maxlength="4" id="r-em"></div>
    </div>
    <label>Description</label><textarea class="field" data-f="desc" rows="2" placeholder="What it is, when you make it, who loves it…"></textarea>
    <div class="row" style="gap:10px;align-items:flex-start">
      <div style="flex:1;min-width:0"><label>Serves</label><input class="field" data-f="serves" type="number" inputmode="numeric" min="1" placeholder="4"></div>
      <div style="flex:1;min-width:0"><label>Prep (min)</label><input class="field" data-f="prep" type="number" inputmode="numeric" min="0" placeholder="15"></div>
      <div style="flex:1;min-width:0"><label>Cook (min)</label><input class="field" data-f="cook" type="number" inputmode="numeric" min="0" placeholder="40"></div>
    </div>
    <label>Difficulty</label><div class="cats" id="r-diff"></div>
    <label>Oven / air fryer</label><div class="cats" id="r-oven"></div>
    <div id="r-temp" class="row" style="margin-top:10px;gap:8px"><input class="field" data-f="temp" type="number" inputmode="numeric" min="0" placeholder="Temperature, e.g. 180" style="flex:1;min-width:0"><div class="seg" id="r-unit"></div></div>
    <label>Ingredients</label><div id="r-ings"></div>
    <div class="irow"><textarea class="field" id="r-ingnew" rows="1" placeholder="Add an ingredient, e.g. 200 g flour" enterkeyhint="enter"></textarea><button class="btn sm" data-ed="ingadd" style="flex:none">Add</button></div>
    <p class="note-s">Put prep notes after a comma (“2 onions, finely chopped”) and only “Onions” goes on your shopping list. You can paste a whole list, one ingredient per line.</p>
    <label>Method</label><div id="r-steps"></div>
    <button class="btn sm ghost" data-ed="stepadd" style="margin-top:12px">＋ Add step</button>
    <p class="note-s">Give a step a timer and you get a countdown button for it while cooking.</p>
    <label>Tips & notes</label><textarea class="field" data-f="notes" rows="3" placeholder="Swaps, what to serve it with, how to store leftovers…"></textarea>
    <label>Source</label><input class="field" data-f="source" placeholder="A link, a book, or Mum" autocapitalize="off" autocorrect="off">
    <div class="row" style="margin-top:22px"><button class="btn ghost" data-ed="cancel">Cancel</button><button class="btn" data-ed="save">Save recipe</button></div>
    ${orig?'<button class="btn danger" data-ed="del" style="margin-top:10px">Delete recipe</button>':''}`,
  (el,close)=>{
    const q=s=>el.querySelector(s);
    const autosize=t=>{ t.style.height='auto'; t.style.height=t.scrollHeight+2+'px'; };
    const fields=el.querySelectorAll('[data-f]');
    fields.forEach(inp=>{ const f=inp.dataset.f, v=f==='temp'?d.oven.temp:d[f]; inp.value=v==null?'':v; });
    const renderHero=()=>{ q('#r-hero').innerHTML=rtile({...d,id:rid},'hero'); q('#r-phl').textContent=d.img?'Change photo':'Add photo'; q('#r-rmph').classList.toggle('hidden',!d.img); q('#r-em').placeholder=rEmoji({name:d.name,em:''}); };
    const renderChips=()=>{
      q('#r-diff').innerHTML=['Easy','Medium','Hard'].map(v=>`<button data-ed="diff" data-v="${v}" class="${d.diff===v?'on':''}">${v}</button>`).join('');
      q('#r-oven').innerHTML=[['none','No oven'],...Object.entries(OVEN)].map(([k,n])=>`<button data-ed="oven" data-v="${k}" class="${d.oven.mode===k?'on':''}">${n}</button>`).join('');
      q('#r-temp').classList.toggle('hidden',d.oven.mode==='none');
      q('#r-unit').innerHTML=['C','F'].map(u=>`<button data-ed="unit" data-v="${u}" class="${d.oven.unit===u?'on':''}">°${u}</button>`).join('');
    };
    const renderIngs=()=>{
      q('#r-ings').innerHTML=d.ingredients.length?d.ingredients.map((g,i)=>`<div class="irow"><input class="field q" data-ii="${i}" data-k="qty" placeholder="Qty" value="${esc(g.qty)}"><input class="field" style="flex:1" data-ii="${i}" data-k="name" placeholder="Ingredient" value="${esc(g.name)}"><button class="x" data-ed="ingrm" data-i="${i}" aria-label="Remove ingredient">✕</button></div>`).join('')
        :`<p class="note-s" style="margin-top:0">No ingredients yet.</p>`;
    };
    const renderSteps=()=>{
      q('#r-steps').innerHTML=d.steps.map((s,i)=>`<div class="srow"><span class="num">${i+1}</span><div style="flex:1;min-width:0">
        <textarea class="field" data-si="${i}" data-k="text" rows="2" placeholder="${i?'What happens next…':'e.g. Preheat the oven to 180°C fan and line a tray.'}">${esc(s.text)}</textarea>
        <div class="sctl"><span aria-hidden="true">⏱</span><input class="field" data-si="${i}" data-k="timer" type="number" inputmode="numeric" min="0" placeholder="Timer" value="${s.timer??''}"><span class="note-s" style="margin:0">min</span><span style="flex:1"></span>
        <button class="x" data-ed="up" data-i="${i}" ${i?'':'disabled'} aria-label="Move up">↑</button><button class="x" data-ed="down" data-i="${i}" ${i<d.steps.length-1?'':'disabled'} aria-label="Move down">↓</button><button class="x" data-ed="steprm" data-i="${i}" aria-label="Remove step">✕</button></div></div></div>`).join('');
      el.querySelectorAll('#r-steps textarea').forEach(autosize);
    };
    const addPending=()=>{ const ta=q('#r-ingnew'); const add=ta.value.split(/\n+/).map(parseIng).filter(Boolean); if(!add.length) return false; d.ingredients.push(...add); ta.value=''; autosize(ta); renderIngs(); return true; };
    renderHero(); renderChips(); renderIngs(); renderSteps();
    el.querySelectorAll('textarea[data-f]').forEach(autosize);

    el.addEventListener('input',e=>{
      const t=e.target;
      if(t.tagName==='TEXTAREA') autosize(t);
      if(t.dataset.f){ const f=t.dataset.f;
        if(f==='serves'||f==='prep'||f==='cook') d[f]=numOrNull(t.value);
        else if(f==='temp') d.oven.temp=numOrNull(t.value);
        else d[f]=t.value;
        if(f==='name'||f==='em') renderHero();
      } else if(t.dataset.ii!=null){ const g=d.ingredients[+t.dataset.ii]; if(g) g[t.dataset.k]=t.value; }
      else if(t.dataset.si!=null){ const s=d.steps[+t.dataset.si]; if(s){ if(t.dataset.k==='timer') s.timer=numOrNull(t.value); else s.text=t.value; } }
    });
    q('#r-ingnew').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); addPending(); } });
    el.addEventListener('click',async e=>{
      const b=e.target.closest('[data-ed]'); if(!b) return;
      const i=+b.dataset.i, v=b.dataset.v;
      switch(b.dataset.ed){
        case 'photo': pickPhoto(async url=>{ const nid=uid(); memImg.set(nid,url); await idbPut(nid,url); d.img=nid; renderHero(); }); break;
        case 'rmphoto': d.img=null; renderHero(); break;
        case 'diff': d.diff=d.diff===v?'':v; renderChips(); break;
        case 'oven': d.oven.mode=v; renderChips(); if(v!=='none'&&!d.oven.temp) setTimeout(()=>q('[data-f=temp]').focus(),50); break;
        case 'unit': d.oven.unit=v; renderChips(); break;
        case 'ingadd': addPending(); q('#r-ingnew').focus(); break;
        case 'ingrm': d.ingredients.splice(i,1); renderIngs(); break;
        case 'stepadd': d.steps.push({id:uid(),text:'',timer:null}); renderSteps(); { const all=el.querySelectorAll('#r-steps textarea'); all[all.length-1].focus(); } break;
        case 'up': case 'down': { const j=b.dataset.ed==='up'?i-1:i+1; if(j<0||j>=d.steps.length) break; [d.steps[i],d.steps[j]]=[d.steps[j],d.steps[i]]; renderSteps(); break; }
        case 'steprm': d.steps.splice(i,1); renderSteps(); break;
        case 'cancel':
          if(JSON.stringify(d)!==start&&!b.dataset.sure){ b.dataset.sure=1; b.textContent='Discard changes?'; return; }
          close(); break;
        case 'save': {
          addPending();
          const name=d.name.trim(); if(!name){ toast('Give the recipe a name'); q('[data-f=name]').focus(); return; }
          const now=Date.now(), oldImg=orig?.img||null;
          const r={id:rid,name,em:d.em.trim(),img:d.img||null,desc:d.desc.trim(),
            serves:d.serves?Math.max(1,Math.round(d.serves)):null,prep:d.prep||null,cook:d.cook||null,diff:d.diff||'',
            oven:d.oven.mode==='none'?{mode:'none',temp:null,unit:d.oven.unit}:{mode:d.oven.mode,temp:d.oven.temp||null,unit:d.oven.unit},
            ingredients:d.ingredients.map(g=>({id:g.id||uid(),qty:String(g.qty||'').trim(),name:String(g.name||'').trim()})).filter(g=>g.name),
            steps:d.steps.map(s=>({id:s.id||uid(),text:String(s.text||'').trim(),timer:s.timer||null})).filter(s=>s.text),
            notes:d.notes.trim(),source:d.source.trim(),at:orig?.at||now,u:now};
          if(r.img!==oldImg){ if(r.img) lsSet(PIMG,[...lsGet(PIMG,[]),r.img]); if(oldImg) lsSet(GIMG,[...lsGet(GIMG,[]),oldImg]); }
          D.recipes[rid]=r; if(cookSt[rid]) cookSt[rid].serves=null;
          for(const k of [...timers.keys()]) if(k.startsWith(rid+':')&&!r.steps.some(s=>k===rid+':'+s.id)) timers.delete(k);
          view.tab='recipes'; view.rid=rid; lsSet('salla-tab','recipes'); lsSet('salla-rid',rid);
          close(); commit(); timersChanged(); window.scrollTo(0,0); wake(); toast(orig?'Recipe saved':'Recipe added to your book 📖');
          break; }
        case 'del': {
          if(!b.dataset.sure){ b.dataset.sure=1; b.textContent='Tap again to delete for good'; return; }
          if(orig.img) lsSet(GIMG,[...lsGet(GIMG,[]),orig.img]);
          delete D.recipes[rid]; D.rdel[rid]=Date.now(); delete cookSt[rid];
          for(const k of [...timers.keys()]) if(k.startsWith(rid+':')) timers.delete(k);
          view.rid=null; lsSet('salla-rid',null);
          close(); commit(); timersChanged(); wake(); toast('Recipe deleted');
          break; }
      }
    });
  },{modal:true,wide:true});
}

/* ============ EVENTS ============ */
$('#addForm').addEventListener('submit',e=>{e.preventDefault();addFromInput();});
$('#addInput').addEventListener('input',renderSuggest);
$('#addInput').addEventListener('blur',()=>setTimeout(()=>{$('#suggest').innerHTML='';},180));
$('#addInput').addEventListener('focus',renderSuggest);
$('#suggest').addEventListener('pointerdown',e=>e.preventDefault());
$('#suggest').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.new){ addFromInput(); return; }
  const it=D.items[b.dataset.pick]; if(!it) return;
  const p=parseEntry($('#addInput').value);
  addItem(it.name,p&&p.qty); $('#addInput').value=''; $('#suggest').innerHTML=''; commit();
});
document.addEventListener('click',e=>{
  if(recipeClick(e)||listClick(e)) return;
  const ed=e.target.closest('[data-edit]'); if(ed){ e.stopPropagation(); editSheet(ed.dataset.edit); return; }
  const ag=e.target.closest('[data-again]'); if(ag){ const it=D.items[ag.dataset.again]; if(it){ addItem(it.name); commit(); } return; }
  if(e.target.closest('#clearBasket')){ clearBasket(); return; }
  const c=e.target.closest('.card[data-id],.li[data-id]'); if(c) toggle(c.dataset.id);
});
$('#settingsBtn').onclick=settingsSheet;
$('#rSearch').addEventListener('input',()=>renderRecipes());

/* ============ BOOT ============ */
loadLocal(); migrateCats(); render(); idbOpen().then(()=>render()); wake(); if(cfgOK()) syncNow();
